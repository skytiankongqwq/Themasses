// 1. 💥 buildscript {} (只保留插件需要的仓库)
buildscript {
    repositories {
        // 本地 deps
        maven { url "file:///${project.projectDir}/deps/" }


        // Forge 的 Maven
        maven { url = 'https://files.minecraftforge.net/maven' }

        // Sponge（MixinGradle 的仓库，如果需要）
        maven {
            name "Sponge"
            url "https://repo.spongepowered.org/repository/maven-public/"
            content { includeGroup "org.spongepowered" }
        }

        // 插件门户
        maven {
            name "Gradle Plugin Portal"
            url 'https://plugins.gradle.org/m2/'
            content {
                includeGroup "gradle.plugin.com.matthewprenger"
                includeGroup "com.modrinth"
            }
        }

        //geckolib
        maven {
            name = 'GeckoLib'
            url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content {
                includeGroupByRegex("software\\.bernie.*")
                includeGroup("com.eliotlash.mclib")
            }
        }

        // Parchment 映射的仓库
        maven {
            url = 'https://maven.parchmentmc.org/'
        }
        mavenCentral()
    }
    dependencies {
        // Forge Gradle 插件依赖
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true

        // 其他插件依赖
        classpath 'gradle.plugin.com.matthewprenger:CurseGradle:1.4.0'
        classpath 'org.parchmentmc:librarian:1.+'
    }
}

// 2. plugins {} 紧随其后
plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'

    // Forge Gradle 插件
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.38'
    id 'com.matthewprenger.cursegradle' version '1.4.0'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true


    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')


            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }
repositories {
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        url "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    flatDir {
        dirs 'libs'
    }
}


dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Compile against only the API artifact
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    implementation fg.deobf("curse.maven:goety-586095:7284580")
    compileOnly fg.deobf("curse.maven:goety-586095:7284580")
    // 软依赖：Patchouli
    compileOnly fg.deobf("curse.maven:patchouli-306770:4892162")
    runtimeOnly fg.deobf("curse.maven:patchouli-306770:4892162")
    // Caelus
    compileOnly fg.deobf("curse.maven:caelus-308989:5281700")
    runtimeOnly fg.deobf("curse.maven:caelus-308989:5281700")
    // Enigmatic Legacy
    compileOnly fg.deobf("curse.maven:enigmatic-legacy-336184:5600004")
    runtimeOnly fg.deobf("curse.maven:enigmatic-legacy-336184:5600004")
    // Enigmatic Addons
    compileOnly fg.deobf("curse.maven:enigmatic-addons-1030121:7085566")
    runtimeOnly fg.deobf("curse.maven:enigmatic-addons-1030121:7085566")
    //  Farmer's Delight
    compileOnly fg.deobf("curse.maven:farmers-delight-398521:6917255")
    runtimeOnly fg.deobf("curse.maven:farmers-delight-398521:6917255")
    // Enigmatic Delicacy
    compileOnly fg.deobf("curse.maven:enigmatic-delicacy-1115663:6728873")
    runtimeOnly fg.deobf("curse.maven:enigmatic-delicacy-1115663:6728873")
    // Player Animator
    compileOnly fg.deobf("curse.maven:playeranimator-658587:4587214")
    runtimeOnly fg.deobf("curse.maven:playeranimator-658587:4587214")
    // Iron's Spells 'n Spellbooks
    compileOnly fg.deobf("curse.maven:irons-spells-n-spellbooks-855414:6970299")
    runtimeOnly fg.deobf("curse.maven:irons-spells-n-spellbooks-855414:6970299")
    // JEI (Just Enough Items)
    compileOnly fg.deobf("curse.maven:jei-238222:7270446")
    runtimeOnly fg.deobf("curse.maven:jei-238222:7270446")
    // Jade
    compileOnly fg.deobf("curse.maven:jade-324717:6855440")
    runtimeOnly fg.deobf("curse.maven:jade-324717:6855440")
    //geckolib
     compileOnly fg.deobf("curse.maven:geckolib-388172:7025129")
     runtimeOnly fg.deobf("curse.maven:geckolib-388172:7025129")
    // Selene / Moonlight Lib
    compileOnly fg.deobf("curse.maven:selene-499980:7191950")
    runtimeOnly fg.deobf("curse.maven:selene-499980:7191950")
    // MmmMmmMmmMmm (Target Dummy)
    compileOnly fg.deobf("curse.maven:mmmmmmmmmmmm-225738:6860192")
    runtimeOnly fg.deobf("curse.maven:mmmmmmmmmmmm-225738:6860192")
    //easy doll
    compileOnly fg.deobf("curse.maven:easydoll-1418074:7781587")
    runtimeOnly fg.deobf("curse.maven:easydoll-1418074:7781587")
    //诡乐



    //implementation("com.eliotlash.mclib:mclib:20")

    // goety Delight
    //compileOnly fg.deobf("curse.maven:goety-delight-1363736:7249959")
    //runtimeOnly fg.deobf("curse.maven:goety-delight-1363736:7249959")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
mixin {
    add sourceSets.main, "themasses.mixins.refmap.json"
    config "themasses.mixins.json"
    debug.verbose = true
    debug.export = true
}
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "themasses.mixins.json"
        ])
    }
    // 默认 jar 不再作为最终成品，交给 jarJar 处理
    finalizedBy 'reobfJar'
}

tasks.named('jarJar') {
    // 设为空，这样它会生成名为 "modid-version.jar" 的包，而不是 "modid-version-all.jar"
    archiveClassifier = ''

    // 确保打包前先运行重混淆
    dependsOn 'jar'

    // 运行完 jarJar 后，必须运行重混淆任务以适配混淆后的 Minecraft 环境
    // 在 Forge 1.20.1 中，通常由 reobfJarJar 处理
    if (tasks.findByName('reobfJarJar')) {
        finalizedBy 'reobfJarJar'
    }
}

// --- 发布配置 ---
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            fg.component(it)
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

// 编码设置
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 强制让 build 任务包含 jarJar
tasks.build {
    dependsOn 'jarJar'
}